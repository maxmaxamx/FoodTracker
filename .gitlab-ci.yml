stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  tags:
    - shell
  script:
    - docker compose -f docker-compose.test.yml build

test-backend-job:
  stage: test
  tags:
    - shell
  script:
    - docker compose -f docker-compose.test.yml up -d postgres
    - docker compose -f docker-compose.test.yml run --rm backend npm run test:ci
  after_script:
    - docker compose -f docker-compose.test.yml down -v

deploy-job:
  stage: deploy
  tags:
    - shell
  script:
    # 1. Полная очистка старых контейнеров и сетей
    - echo "=== Stopping old containers ==="
    - docker compose down --remove-orphans --volumes || true
    - docker compose down --remove-orphans || true
    
    # 2. Убиваем зависшие контейнеры, которые могут держать порты
    - echo "=== Killing containers on ports 3000 and 4200 ==="
    - |
      for port in 3000 4200; do
        container_id=$(docker ps --filter "publish=$port" -q)
        if [ -n "$container_id" ]; then
          echo "Stopping container $container_id on port $port"
          docker stop $container_id || true
          docker rm $container_id || true
        fi
      done
    
    # 3. Ждем освобождения портов
    - sleep 3
    
    # 4. Обновляем конфиг Nginx
    - echo "=== Updating Nginx configuration ==="
    - sudo cp nginx/foodtracker.conf /etc/nginx/sites-available/foodtracker
    - sudo ln -sf /etc/nginx/sites-available/foodtracker /etc/nginx/sites-enabled/foodtracker
    - sudo nginx -t
    - sudo systemctl reload nginx
    
    # 5. Собираем и запускаем новые контейнеры
    - echo "=== Building and starting containers ==="
    - docker compose up -d --build
    
    # 6. Ждем запуска и проверяем здоровье
    - echo "=== Waiting for containers to start ==="
    - sleep 15
    
    # 7. Проверяем статус контейнеров
    - echo "=== Container status ==="
    - docker compose ps
    
    # 8. Проверяем, что все контейнеры запущены
    - |
      if ! docker compose ps | grep -q "foodtracker-api"; then
        echo "ERROR: foodtracker-api is not running!"
        docker compose logs api
        exit 1
      fi
      if ! docker compose ps | grep -q "foodtracker-web"; then
        echo "ERROR: foodtracker-web is not running!"
        docker compose logs web
        exit 1
      fi
    
    # 9. Проверяем доступность сервисов
    - echo "=== Checking service availability ==="
    - curl -f http://localhost:3000 || (echo "Backend not accessible" && docker compose logs api && exit 1)
    - curl -f http://localhost:4200 || (echo "Frontend not accessible" && docker compose logs web && exit 1)
    
    - echo "=== Deployment completed successfully! ==="
  only:
    - main